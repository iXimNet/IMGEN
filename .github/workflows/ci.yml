name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pillow fastapi "uvicorn[standard]" python-multipart httpx pydantic
          # The engine imports torch at runtime and a good many tests drive those
          # paths, so the suite cannot run without it. requirements.txt leaves it
          # out on purpose -- the studio's build is the user's to choose -- so CI
          # takes the CPU wheel, the smallest one that makes the code importable.
          # Without it the run dies during collection and never executes a test.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Test
        run: pytest -q
      - name: Prompt catalog size
        run: python -c "from imgen.prompts import catalog; c=catalog()['counts']; assert c['generate_prompts']>=70, c"
