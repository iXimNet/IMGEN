name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pillow fastapi "uvicorn[standard]" python-multipart httpx pydantic
      - name: Test
        run: pytest -q
      - name: Prompt catalog size
        run: python -c "from imgen.prompts import catalog; c=catalog()['counts']; assert c['generate_prompts']>=70, c"
