[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imgen"
version = "0.1.0"
description = "Local visual studio for Qwen-Image-2.1 — generate and edit, including multi-reference editing."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "IMGEN contributors" }]
keywords = [
  "qwen-image",
  "text-to-image",
  "image-editing",
  "diffusers",
  "fastapi",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU :: NVIDIA CUDA",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "pydantic>=2.7",
  "pillow>=10.4",
  "huggingface-hub>=0.30",
  "safetensors>=0.4.5",
  "accelerate>=1.0",
  "transformers>=5.17",
  "modelscope>=1.25",
  "httpx>=0.27",
  "aiofiles>=24.1",
]

[project.optional-dependencies]
int8 = ["bitsandbytes>=0.45"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
imgen = "imgen.__main__:main"

[project.urls]
Homepage = "https://github.com/imgen-studio/imgen"
Issues = "https://github.com/imgen-studio/imgen/issues"
Qwen = "https://github.com/QwenLM/Qwen-Image-2.1"

[tool.setuptools.packages.find]
include = ["imgen*"]

[tool.setuptools.package-data]
imgen = ["static/**/*", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
